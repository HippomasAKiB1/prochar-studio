<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330">
  <defs id="halftone_dots-defs">
    <pattern id="halftone_dots-pat-a" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle id="halftone_dots-dot-a" cx="10" cy="10" r="1.2" fill="var(--c-on-primary)"/>
    </pattern>
    <pattern id="halftone_dots-pat-b" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle id="halftone_dots-dot-b" cx="10" cy="10" r="2.4" fill="var(--c-on-primary)"/>
    </pattern>
    <pattern id="halftone_dots-pat-c" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle id="halftone_dots-dot-c" cx="10" cy="10" r="4.2" fill="var(--c-on-primary)"/>
    </pattern>
    <clipPath id="halftone_dots-clip-a">
      <rect id="halftone_dots-crect-a" x="0" y="0" width="200" height="330"/>
    </clipPath>
    <clipPath id="halftone_dots-clip-b">
      <rect id="halftone_dots-crect-b" x="200" y="0" width="200" height="330"/>
    </clipPath>
    <clipPath id="halftone_dots-clip-c">
      <rect id="halftone_dots-crect-c" x="400" y="0" width="200" height="330"/>
    </clipPath>
  </defs>
  <g id="halftone_dots-group">
    <rect id="halftone_dots-rect-a" x="0" y="0" width="200" height="330" fill="url(#halftone_dots-pat-a)" clip-path="url(#halftone_dots-clip-a)"/>
    <rect id="halftone_dots-rect-b" x="200" y="0" width="200" height="330" fill="url(#halftone_dots-pat-b)" clip-path="url(#halftone_dots-clip-b)"/>
    <rect id="halftone_dots-rect-c" x="400" y="0" width="200" height="330" fill="url(#halftone_dots-pat-c)" clip-path="url(#halftone_dots-clip-c)"/>
  </g>
</svg>
