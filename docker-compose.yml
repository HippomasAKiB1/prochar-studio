services:
  mongo:
    image: mongo:7
    container_name: prochar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prochar-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - LOG_LEVEL=info
      - MONGODB_URI=mongodb://mongo:27017/prochar-studio
      - JWT_SECRET=production_ready_jwt_secret_min_32_characters_long
      - JWT_EXPIRES_IN=7d
      - CLIENT_ORIGIN=http://localhost:3000
      - AI_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - GEMINI_MODEL=gemini-2.5-flash
      - DEMO_PASSWORD=ProcharDemo2026!
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
